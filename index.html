
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17365d">
  <title>Ponto Eletrônico Escolar — Câmera</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #f2f5f9;
      color: #202b3c;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 520px;
      margin: 0 auto;
      padding: 22px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px #00000012;
    }

    h1 { font-size: 23px; margin-top: 0; }
    p { line-height: 1.5; }

    video {
      display: block;
      width: 100%;
      max-height: 65vh;
      background: #17202b;
      border-radius: 12px;
      object-fit: cover;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: 0;
      border-radius: 9px;
      background: #17365d;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #mensagem {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #edf2f7;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .erro {
      background: #fff0f0 !important;
      color: #9d2020;
    }

    .sucesso {
      background: #eaf7ed !important;
      color: #176b32;
    }

    .aviso {
      background: #fff7df !important;
      color: #70530a;
    }

    .nota {
      color: #586579;
      font-size: 13px;
    }
  </style>
</head>

<body>
<main>
  <h1>Ponto Eletrônico Escolar</h1>

  <p>
    Ative a câmera, posicione o rosto e tire a fotografia
    para registrar o ponto.
  </p>

  <video id="video" autoplay playsinline muted></video>

  <button id="ativar" type="button">
    Ativar câmera
  </button>

  <button id="capturar" type="button" disabled>
    Tirar foto e enviar para o sistema
  </button>

  <div id="mensagem" role="status" aria-live="polite">
    Verificando comunicação com o sistema de ponto...
  </div>

  <p class="nota">
    A fotografia e a localização serão encaminhadas à janela
    do sistema que abriu esta página. O registro depende da
    validação do servidor.
  </p>
</main>

<script>
(function () {
  "use strict";

  const video = document.getElementById("video");
  const ativar = document.getElementById("ativar");
  const capturar = document.getElementById("capturar");
  const mensagem = document.getElementById("mensagem");

  const TIPO_CONFIG = "PONTO_CAMERA_CONFIG";
  const TIPO_PRONTO = "PONTO_CAMERA_READY";
  const TIPO_FOTO = "PONTO_CAMERA_FOTO";

  let fluxo = null;
  let enviando = false;
  let origemSistema = null;
  let sistemaConfirmado = false;

  function informar(texto, tipo) {
    mensagem.textContent = texto;
    mensagem.className = tipo || "";
  }

  function janelaOriginalDisponivel() {
    try {
      return Boolean(window.opener && !window.opener.closed);
    } catch (erro) {
      return false;
    }
  }

  function origemSistemaPermitida(origem) {
    try {
      const url = new URL(origem);

      if (url.protocol !== "https:") {
        return false;
      }

      const host = url.hostname.toLowerCase();

      return host === "script.google.com" ||
             host === "script.googleusercontent.com" ||
             host.endsWith(".script.googleusercontent.com");
    } catch (erro) {
      return false;
    }
  }

  function avisarSistemaQueEstaPronta() {
    if (!janelaOriginalDisponivel()) {
      informar(
        "Abra esta página pelo botão de câmera do sistema de ponto.",
        "erro"
      );
      return;
    }

    try {
      /*
       * A mensagem READY não contém foto, localização ou token.
       * O sistema principal deverá validar a origem e a janela
       * que enviou esta mensagem antes de responder.
       */
      window.opener.postMessage(
        { type: TIPO_PRONTO },
        "*"
      );
    } catch (erro) {
      informar(
        "Não foi possível iniciar a comunicação com o sistema.",
        "erro"
      );
    }
  }

  window.addEventListener("message", function (evento) {
    if (!janelaOriginalDisponivel()) {
      return;
    }

    if (evento.source !== window.opener) {
      return;
    }

    if (evento.data?.type !== TIPO_CONFIG) {
      return;
    }

    if (!origemSistemaPermitida(evento.origin)) {
      informar(
        "A origem do sistema de ponto não foi reconhecida. " +
        "Feche esta janela e abra novamente pelo sistema.",
        "erro"
      );
      return;
    }

    /*
     * A origem confiável vem do navegador, pelo evento recebido.
     * Não usamos document.referrer nem um destino "*" para a foto.
     */
    origemSistema = evento.origin;
    sistemaConfirmado = true;

    informar(
      "Comunicação com o sistema estabelecida. Você pode ativar a câmera.",
      "sucesso"
    );
  });

  function pararCamera() {
    if (fluxo) {
      fluxo.getTracks().forEach(function (trilha) {
        trilha.stop();
      });
    }

    fluxo = null;
    video.srcObject = null;
    capturar.disabled = true;
  }

  ativar.addEventListener("click", async function () {
    if (!janelaOriginalDisponivel()) {
      informar(
        "Abra esta página pelo botão de câmera do sistema de ponto.",
        "erro"
      );
      return;
    }

    if (!sistemaConfirmado || !origemSistema) {
      informar(
        "Aguardando confirmação da comunicação com o sistema. " +
        "Feche esta janela e abra novamente pelo botão de câmera.",
        "aviso"
      );
      return;
    }

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      informar(
        "O navegador não disponibilizou a câmera. " +
        "Verifique se está usando o endereço HTTPS.",
        "erro"
      );
      return;
    }

    ativar.disabled = true;
    informar("Solicitando acesso à câmera...", "aviso");

    try {
      try {
        fluxo = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "user" },
            width: { ideal: 640 },
            height: { ideal: 480 }
          }
        });
      } catch (erroInicial) {
        fluxo = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: true
        });
      }

      video.srcObject = fluxo;
      await video.play();

      capturar.disabled = false;
      ativar.textContent = "Câmera ativada";

      informar(
        "Câmera ativada. Ao tirar a foto, autorize também a localização.",
        "sucesso"
      );
    } catch (erro) {
      pararCamera();
      ativar.disabled = false;

      let texto = "Não foi possível ativar a câmera.";

      if (erro && erro.name === "NotAllowedError") {
        texto =
          "O acesso à câmera foi negado. Verifique as permissões do navegador.";
      } else if (erro && erro.name === "NotFoundError") {
        texto = "Nenhuma câmera foi encontrada neste aparelho.";
      } else if (erro && erro.name === "NotReadableError") {
        texto = "A câmera pode estar sendo usada por outro aplicativo.";
      }

      informar(
        texto + " Detalhe: " +
        (erro && erro.message ? erro.message : "sem detalhes"),
        "erro"
      );
    }
  });

  capturar.addEventListener("click", function () {
    if (enviando || !fluxo || !video.videoWidth) {
      informar("Ative a câmera antes de tirar a foto.", "erro");
      return;
    }

    if (!sistemaConfirmado ||
        !origemSistema ||
        !janelaOriginalDisponivel()) {
      informar(
        "A comunicação com o sistema não está disponível. " +
        "Feche esta janela e abra novamente pelo sistema de ponto.",
        "erro"
      );
      return;
    }

    if (!navigator.geolocation) {
      informar(
        "Este navegador não disponibilizou a localização.",
        "erro"
      );
      return;
    }

    enviando = true;
    capturar.disabled = true;
    ativar.disabled = true;

    informar("Obtendo a localização do aparelho...", "aviso");

    navigator.geolocation.getCurrentPosition(
      function (posicao) {
        try {
          if (!janelaOriginalDisponivel()) {
            throw new Error(
              "A janela original do sistema foi fechada."
            );
          }

          const larguraOriginal = video.videoWidth;
          const alturaOriginal = video.videoHeight;

          const escala = Math.min(
            1,
            640 / larguraOriginal,
            480 / alturaOriginal
          );

          const canvas = document.createElement("canvas");

          canvas.width = Math.round(larguraOriginal * escala);
          canvas.height = Math.round(alturaOriginal * escala);

          const contexto = canvas.getContext("2d");

          if (!contexto) {
            throw new Error(
              "Não foi possível preparar a fotografia."
            );
          }

          contexto.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
          );

          const foto = canvas.toDataURL("image/jpeg", 0.75);

          if (!foto.startsWith("data:image/jpeg;base64,")) {
            throw new Error(
              "A fotografia não foi gerada no formato esperado."
            );
          }

          if (foto.length > 5 * 1024 * 1024) {
            throw new Error(
              "A fotografia ficou muito grande. Tente novamente."
            );
          }

          const dados = {
            type: TIPO_FOTO,
            foto: foto,
            latitude: posicao.coords.latitude,
            longitude: posicao.coords.longitude,
            precisao: posicao.coords.accuracy,
            dispositivo: navigator.userAgent.slice(0, 100)
          };

          /*
           * Envia a fotografia exclusivamente para a origem
           * confirmada durante a comunicação inicial.
           */
          window.opener.postMessage(dados, origemSistema);

          informar(
            "Fotografia e localização enviadas à janela do sistema. " +
            "Confira a confirmação do registro na tela original.",
            "sucesso"
          );

          pararCamera();
        } catch (erro) {
          informar(
            erro && erro.message
              ? erro.message
              : "Não foi possível enviar a fotografia.",
            "erro"
          );
        } finally {
          enviando = false;
          ativar.disabled = false;
          capturar.disabled = !fluxo;
        }
      },

      function (erro) {
        enviando = false;
        ativar.disabled = false;
        capturar.disabled = !fluxo;

        informar(
          "Não foi possível obter a localização. Autorize o acesso " +
          "à localização e tente novamente. " +
          (erro && erro.message ? erro.message : ""),
          "erro"
        );
      },

      {
        enableHighAccuracy: true,
        timeout: 20000,
        maximumAge: 0
      }
    );
  });

  window.addEventListener("beforeunload", pararCamera);

  /*
   * Inicia a comunicação ao carregar a página.
   */
  avisarSistemaQueEstaPronta();
})();
</script>
</body>
</html>
